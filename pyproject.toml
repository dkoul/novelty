[project]
name = "novelty"
version = "0.1.0"
description = "The fastest and cheapest LLM call is the one you never make"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
sentence-transformers = ["sentence-transformers>=2.2.0"]
postgres = ["psycopg[binary]>=3.1.0"]
all = ["sentence-transformers>=2.2.0", "psycopg[binary]>=3.1.0"]

[project.scripts]
novelty = "novelty.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["novelty"]
